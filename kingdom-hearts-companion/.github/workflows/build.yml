name: Build EPUB and publish download page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the EPUB
        run: ./build.sh
      - name: Check the EPUB is a valid zip with mimetype first
        run: |
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('dist/kingdom-hearts-companion.epub')
          first = z.infolist()[0]
          assert first.filename == 'mimetype' and first.compress_type == zipfile.ZIP_STORED, first
          assert z.testzip() is None
          assert z.read('mimetype') == b'application/epub+zip'
          print('ok', len(z.namelist()), 'files')
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-hearts-companion.epub
          path: dist/kingdom-hearts-companion.epub
      - name: Assemble the download page
        run: |
          mkdir -p public
          cp site/index.html public/
          cp dist/kingdom-hearts-companion.epub public/
          cp book/OEBPS/images/cover.jpg public/cover.jpg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
